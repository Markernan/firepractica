plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.pucp.firepractica'
    compileSdk 35

    defaultConfig {
        applicationId "com.pucp.firepractica"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Solo para probar sin credenciales: ./gradlew assembleDebug -PuseEmulator=true
        buildConfigField "boolean", "USE_EMULATOR", "${project.findProperty('useEmulator') ?: 'false'}"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    // Inicio de sesión con Facebook (Firebase exige el SDK oficial de Facebook)
    implementation 'com.facebook.android:facebook-login:17.0.2'

    // Inicio de sesión con Google (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.5'
}
